name: API probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts || true
      - name: Decompile
        run: |
          set +e
          JAR=$GITHUB_WORKSPACE/build/moddev/artifacts/minecraft-patched-26.3.0.23-beta.jar
          curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir -p /tmp/cls /tmp/out && cd /tmp/cls
          P=net/minecraft/world/level/levelgen/structure
          unzip -q -o $JAR "$P/Structure.class" "$P/Structure\$*" "$P/StructureType*" "$P/StructurePiece.class" "$P/StructurePiece\$*" "$P/StructurePieceType*" "$P/StructureSet*" "$P/ScatteredFeaturePiece*" "$P/TerrainAdjustment*" "$P/StructureSpawnOverride*" "$P/BoundingBox.class" \
            "$P/structures/SwampHutPiece*" "$P/structures/SwampHutStructure*" "$P/structures/DesertPyramidStructure*" "$P/structures/IglooStructure*" \
            "$P/placement/RandomSpreadStructurePlacement*" "$P/placement/ConcentricRingsStructurePlacement*" "$P/placement/StructurePlacement.class" "$P/placement/StructurePlacement\$*" \
            "$P/pieces/StructurePieceSerializationContext*" "$P/pieces/StructurePiecesBuilder*" \
            "net/minecraft/data/worldgen/Structures.class" "net/minecraft/data/worldgen/StructureSets.class" \
            "net/minecraft/world/RandomizableContainer*" \
            "net/minecraft/advancements/predicates/LocationPredicate*" "net/minecraft/advancements/triggers/PlayerTrigger*" \
            "net/minecraft/world/level/storage/loot/functions/SetComponentsFunction*" "net/minecraft/world/level/storage/loot/functions/SetItemDamageFunction*" \
            "net/minecraft/client/gui/screens/Screen.class" "net/minecraft/client/gui/screens/inventory/BookViewScreen.class" \
            "net/minecraft/client/color/item/ItemTintSource*" "net/minecraft/client/color/item/ItemTintSources*" "net/minecraft/client/color/item/Constant*" \
            "net/minecraft/world/level/block/CarpetBlock.class" "net/minecraft/world/level/block/RotatedPillarBlock.class" \
            "net/minecraft/data/loot/LootTableSubProvider.class" "net/minecraft/data/loot/packs/VanillaChestLoot.class" \
            "net/minecraft/world/level/storage/loot/BuiltInLootTables.class" 2>&1 | tail -3
          find . -name "*.class" | wc -l
          java -jar /tmp/vf.jar -din=0 -rbr=1 -dgs=1 -log=WARN /tmp/cls /tmp/out > /dev/null 2>&1
          cd /tmp/out
          find . -name "*.java" | sort
          for f in $(find . -name "*.java" | sort); do echo "######## $f"; cat "$f"; done
