name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run data generators
        run: ./gradlew runData --stacktrace

      - name: Check generated resources are committed
        run: |
          git add -N src/generated
          if ! git diff --quiet -- src/generated; then
            echo "::error::Generated resources are out of date. Run ./gradlew runData and commit src/generated."
            git --no-pager diff --stat -- src/generated
            git --no-pager diff -- src/generated | head -n 4000
            # Compact form for tools that cannot download artifacts: gzip + base64 in long lines.
            echo "----- BEGIN GENERATED PATCH (gzip+base64) -----"
            git --no-pager diff --binary -- src/generated | gzip -9 | base64 -w 6000
            echo "----- END GENERATED PATCH -----"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --stacktrace

      # Boots a dedicated game-test server: loads every registry and datapack entry, runs the game tests, exits.
      - name: Game tests
        timeout-minutes: 10
        run: ./gradlew runGameTestServer --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
