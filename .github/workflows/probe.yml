name: Probe

on:
  push:
    branches: ['claude/**']
    paths: ['.probe/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare
        run: ./gradlew createMinecraftArtifacts --stacktrace -q
      - name: Probe
        run: bash .probe/probe.sh
